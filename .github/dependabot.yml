# Standard automation onboarding: watch Python (pip) dependencies and the
# GitHub Actions used by this repo, via Dependabot.
version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
