name: PR Review (tombstoned pending pinned-action review)
on:
  workflow_dispatch:
jobs:
  disabled:
    # Offline remediation cannot prove immutable revisions for the external
    # action and its credential/tool contract. Keep this capability inert.
    if: '${{ false }}'
    runs-on: ubuntu-latest
    permissions:
      contents: none
    steps:
      - name: Tombstone notice
        run: >-
          echo "Tombstoned: requires owner-approved immutable action pins and a least-privilege review boundary."
