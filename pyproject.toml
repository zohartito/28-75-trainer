[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trainer2875"
version = "0.1.0"
description = "Local deliberate-practice loop for photographers using a 28-75mm zoom."
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "28-75 Trainer" }]
dependencies = []

[project.scripts]
trainer2875 = "trainer2875.cli:main"

[tool.setuptools]
packages = ["trainer2875"]
